<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Financeiro — ClassManager</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/dashboard.css"><link rel="stylesheet" href="css/gestao.css"></head><body class="app-body"><aside class="sidebar"><a class="brand-mark" href="dashboard.html">ClassManager</a><p class="nav-group-label">GESTÃO</p><nav class="nav-list"><a class="nav-link" href="dashboard.html">Painel principal</a><a class="nav-link" href="gestao.html">Cursos e matrículas</a><a class="nav-link active" href="financeiro.html"><i data-lucide="wallet-cards" aria-hidden="true"></i> Financeiro</a></nav><div class="sidebar-footer"><div class="user-chip"><div class="user-avatar">G</div><div class="user-info"><div class="user-name">Gestão</div></div></div><button class="logout-link" id="sair">Sair</button></div></aside><div class="main-area"><header class="topbar"><div><h1><i data-lucide="wallet-cards" aria-hidden="true"></i> Financeiro</h1><p class="sub">Mensalidades e pagamentos manuais da demonstração.</p></div></header><main class="content"><section><div class="panel-head"><h2>Mensalidades</h2><button class="btn btn-accent" id="nova-mensalidade">＋ Nova mensalidade</button></div><div class="card table-wrap"><table class="data-table"><thead><tr><th>Aluno</th><th>Referência</th><th>Vencimento</th><th>Valor</th><th>Pago</th><th>Saldo</th><th>Status</th><th></th></tr></thead><tbody id="faturas-lista"></tbody></table></div><form id="fatura-form" class="card form-grid" hidden><h3>Criar mensalidade</h3><label>Matrícula ativa<select id="fatura-matricula" required></select></label><label>Referência (AAAA-MM)<input id="fatura-referencia" type="month" required></label><label>Vencimento<input id="fatura-vencimento" type="date" required></label><label>Valor (R$)<input id="fatura-valor" type="number" step="0.01" min="0.01" required></label><label>Desconto (R$)<input id="fatura-desconto" type="number" step="0.01" min="0" value="0"></label><label>Multa (R$)<input id="fatura-multa" type="number" step="0.01" min="0" value="0"></label><label>Juros (R$)<input id="fatura-juros" type="number" step="0.01" min="0" value="0"></label><div><button class="btn btn-primary">Salvar mensalidade</button><button type="button" class="btn btn-ghost" id="cancelar-fatura">Cancelar</button></div></form></section><section><div class="panel-head"><h2>Histórico de pagamentos</h2></div><div class="card table-wrap"><table class="data-table"><thead><tr><th>Aluno</th><th>Referência</th><th>Data</th><th>Forma</th><th>Valor</th></tr></thead><tbody id="pagamentos-lista"></tbody></table></div></section></main></div><div id="toast-stack"></div><div class="modal-overlay" id="pagamento-modal" hidden><form id="pagamento-form" class="payment-dialog form-grid"><h3>Registrar pagamento</h3><input id="pagamento-id" type="hidden"><label>Valor recebido (R$)<input id="pagamento-valor" type="number" step="0.01" min="0.01" required></label><label>Data e hora<input id="pagamento-data" type="datetime-local" required></label><label>Forma<select id="pagamento-forma"><option value="pix">Pix</option><option value="dinheiro">Dinheiro</option><option value="cartão">Cartão</option><option value="transferência">Transferência</option><option value="outro">Outro</option></select></label><label>Observações<input id="pagamento-obs" maxlength="255"></label><div><button class="btn btn-primary">Confirmar pagamento</button><button type="button" class="btn btn-ghost" id="fechar-pagamento">Cancelar</button></div></form></div><script src="https://unpkg.com/lucide@0.468.0"></script><script src="js/financeiro.js"></script></body></html>
